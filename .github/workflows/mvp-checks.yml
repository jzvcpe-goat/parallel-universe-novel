name: MVP Creator Checks

on:
  pull_request:
  push:
    branches:
      - main
      - preview/**

permissions:
  contents: read
  pull-requests: read

jobs:
  creator-mvp:
    name: Local Creator MVP boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci --include=optional

      - name: Install app dependencies
        run: npm --prefix app ci --include=optional

      - name: Verify Creator MVP
        run: |
          npm run test:creator-literary-evidence-workspace-contract
          npm run check:pivot
          npm run test:creator

      - name: Build local Creator
        run: npm run build:creator

  diff-hygiene:
    name: Diff hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
